name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  circle-to-search:
    runs-on: macos-15
    defaults:
      run:
        working-directory: CircleToSearch
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Add API key (optional)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            sed -i '' "s|YOUR_ANTHROPIC_API_KEY\"$|$ANTHROPIC_API_KEY\"|" Shared/Config.swift
            echo "API key added: AI answers on"
          else
            echo "No ANTHROPIC_API_KEY secret: building without AI answers"
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project CircleToSearch.xcodeproj \
            -scheme CircleToSearch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CircleToSearch.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*deprecated|\*\* ARCHIVE" || true
          test -d build/CircleToSearch.xcarchive/Products/Applications/CircleToSearch.app || { grep -E "error:" build.log; exit 1; }

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/CircleToSearch.xcarchive/Products/Applications/CircleToSearch.app build/Payload/
          cd build && zip -qry CircleToSearch.ipa Payload && ls -lh CircleToSearch.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CircleToSearch-ipa
          path: CircleToSearch/build/CircleToSearch.ipa

      - name: Publish to the "latest" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/CircleToSearch.ipa \
            --title "Circle to Search (latest build)" \
            --notes "Unsigned build of ${GITHUB_SHA::7}. Install with Sideloadly or AltStore, which sign it with your Apple ID." \
            --target "$GITHUB_SHA"
